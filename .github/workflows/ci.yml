name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.14 is what the app ships on (.python-version; release.yml freezes the Windows package
        # with it); 3.11 is the oldest interpreter requires-python allows, so it is the one
        # that guards the lower bound.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # No ffmpeg, no JavaScript runtime, no network: the suite embeds its audio fixtures and
      # stubs tool detection (tests/conftest.py), so the runners need nothing but uv.
      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -q
