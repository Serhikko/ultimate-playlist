[project]
name = "ultimate-playlist"
version = "0.2.0"
description = "Paste YouTube or Spotify links, get tagged MP3s in one local library, build your ultimate playlist."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "yt-dlp[default]>=2026.1.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mutagen>=1.47",
    "requests>=2.32",
]

[project.scripts]
ultimate-playlist = "ultimate_playlist.cli:main"
up = "ultimate_playlist.cli:main"

[dependency-groups]
build = [
    "pyinstaller>=6.22.2",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ultimate_playlist"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_tools: run the real ffmpeg / JavaScript runtime detection instead of the stubs",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "PERF"]
ignore = ["E501"]
