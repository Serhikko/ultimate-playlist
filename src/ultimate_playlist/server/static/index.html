<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Ultimate Playlist</title>
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Inline icon sprite: no external resources, works offline. -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"><polygon points="7 4 20 12 7 20 7 4"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></symbol>
    <symbol id="i-retry" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></symbol>
    <symbol id="i-grip" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="9" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="15" cy="18" r="1.6"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
  </svg>

  <header class="topbar">
    <div class="brand" id="brand" title="Ultimate Playlist">
      <svg class="icon" aria-hidden="true"><use href="#i-logo"/></svg>
      <span>Ultimate Playlist</span>
    </div>
    <form id="download-form" class="url-form" autocomplete="off">
      <textarea id="url-input" rows="1" placeholder="Paste a YouTube or Spotify link or playlist…" spellcheck="false" autocomplete="off" aria-label="Links to download" title="Paste one or more YouTube or Spotify links (one per line). Enter downloads, Shift+Enter adds a line."></textarea>
      <button type="submit" id="download-btn" class="btn btn-primary">
        <svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>
        <span>Download</span>
      </button>
    </form>
    <div class="chips" id="status-chips" aria-live="polite"></div>
    <button type="button" id="settings-btn" class="icon-btn settings-btn" title="Settings" aria-label="Settings"><svg class="icon" aria-hidden="true"><use href="#i-gear"/></svg></button>
  </header>

  <main class="layout">
    <aside class="panel queue" aria-label="Download queue">
      <div class="panel-head">
        <h2>Queue</h2>
        <button type="button" id="clear-finished" class="btn btn-ghost btn-sm" disabled>Clear finished</button>
      </div>
      <div id="queue-list" class="panel-body"></div>
    </aside>

    <section class="panel content">
      <nav class="tabs" role="tablist" aria-label="Main">
        <button type="button" class="tab active" role="tab" aria-selected="true" data-tab="library">Library</button>
        <button type="button" class="tab" role="tab" aria-selected="false" data-tab="playlists">Playlists</button>
      </nav>

      <div id="tab-library" class="tab-pane active" role="tabpanel">
        <div class="toolbar">
          <input id="search" class="input" type="search" placeholder="Search title, artist or album…" aria-label="Search library">
          <span id="library-count" class="muted count"></span>
          <div id="selection-bar" class="selection-bar" hidden>
            <span id="selection-count"></span>
            <button type="button" id="add-selected" class="btn btn-sm btn-primary">
              <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
              <span>Add selected to playlist</span>
            </button>
            <button type="button" id="clear-selection" class="btn btn-sm btn-ghost">Clear</button>
          </div>
          <span class="spacer"></span>
          <button type="button" id="rescan" class="btn btn-ghost btn-sm" title="Pick up files added to the library folder outside the app">
            <svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>
            <span>Rescan</span>
          </button>
        </div>
        <div id="library-list" class="scroll"></div>
      </div>

      <div id="tab-playlists" class="tab-pane" role="tabpanel">
        <div class="playlists-layout">
          <div class="pl-sidebar">
            <div class="toolbar">
              <h3>Playlists</h3>
              <span class="spacer"></span>
              <button type="button" id="new-playlist" class="btn btn-sm">
                <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
                <span>New</span>
              </button>
            </div>
            <ul id="playlist-list" class="pl-list"></ul>
          </div>
          <div id="playlist-detail" class="pl-detail"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="player" aria-label="Player">
    <div class="np">
      <div id="np-cover"></div>
      <div class="np-meta">
        <div id="np-title" class="np-title">Nothing playing</div>
        <div id="np-artist" class="np-artist muted">Pick a track from the library</div>
      </div>
    </div>
    <div class="controls">
      <div class="buttons">
        <button type="button" id="btn-shuffle" class="icon-btn toggle" title="Shuffle" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-shuffle"/></svg></button>
        <button type="button" id="btn-prev" class="icon-btn" title="Previous" disabled><svg class="icon" aria-hidden="true"><use href="#i-prev"/></svg></button>
        <button type="button" id="btn-play" class="icon-btn big" title="Play / Pause (Space)" disabled><svg class="icon" aria-hidden="true"><use href="#i-play"/></svg></button>
        <button type="button" id="btn-next" class="icon-btn" title="Next" disabled><svg class="icon" aria-hidden="true"><use href="#i-next"/></svg></button>
        <button type="button" id="btn-repeat" class="icon-btn toggle" title="Repeat: off" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-repeat"/></svg><span class="badge" hidden>1</span></button>
      </div>
      <div class="seek">
        <span id="time-cur" class="time">0:00</span>
        <input id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Seek" disabled>
        <span id="time-dur" class="time">0:00</span>
      </div>
    </div>
    <div class="volume">
      <button type="button" id="btn-mute" class="icon-btn" title="Mute"><svg class="icon" aria-hidden="true"><use href="#i-volume"/></svg></button>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
    </div>
    <audio id="audio" preload="metadata"></audio>
  </footer>

  <div id="toasts" class="toasts" aria-live="assertive"></div>
  <div id="menu" class="menu" role="menu" hidden></div>
  <dialog id="dialog"></dialog>

  <script src="/static/app.js"></script>
</body>
</html>
